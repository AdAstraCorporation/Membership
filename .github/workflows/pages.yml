name: publicar

# Publica la raíz del repo en GitHub Pages (fuente: GitHub Actions).
# No hay paso de compilación: el sitio son archivos estáticos.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Versión por commit en app.js y style.css: tras cada publicación el navegador descarga
      # los archivos nuevos en vez de usar los de la caché (GitHub Pages cachea ~10 min).
      - name: Versionar recursos
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s#src=\"app.js\"#src=\"app.js?v=$v\"#; s#href=\"style.css\"#href=\"style.css?v=$v\"#" index.html
          grep -n "?v=$v" index.html
          # La webapp detecta la versión nueva porque sw.js cambia en cada publicación.
          sed -i "s#const VERSION = \"dev\"#const VERSION = \"$v\"#" sw.js
          grep -n "VERSION = \"$v\"" sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
